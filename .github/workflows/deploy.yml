name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 6'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.date }}
      cached: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - id: release
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          date=$(curl -fsSIL -u "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" \
            'https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz' \
            | grep -i '^content-disposition:' | grep -Eo '[0-9]{8}' | tail -1)
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/maxmind
          key: maxmind-${{ steps.release.outputs.date }}
          lookup-only: true

  deploy:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.cached != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - run: npm i
      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/maxmind
          key: maxmind-${{ needs.check.outputs.release }}
      - run: npm t
      - run: npm run build
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ctf --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.check.outputs.cached != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/maxmind
          key: maxmind-${{ needs.check.outputs.release }}
