<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>404 Not Found · ctf.pages.dev</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b1020;
        color: #e2e8f0;
        text-align: center;
        padding: 24px;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid #22d3ee;
        outline-offset: 3px;
      }
      body {
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      .card {
        max-width: 520px;
      }
      .sprite {
        width: 8px;
        height: 8px;
        margin: 0 auto 34px;
        position: relative;
        top: -40px;
        left: -40px;
        animation: hover 2.6s ease-in-out infinite;
      }
      @keyframes hover {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #22d3ee;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 2.1rem;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        text-shadow: 3px 3px 0 rgba(34, 211, 238, 0.35);
      }
      .uppercase {
        text-transform: uppercase;
      }
      .lede {
        font-size: 0.94rem;
        line-height: 1.7;
        color: #94a3b8;
        max-width: 40ch;
        margin: 0 auto;
      }
      .acts {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      .btn {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 13px 24px;
        text-decoration: none;
        border: 2px solid #22d3ee;
        color: #22d3ee;
        background: none;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .btn:hover {
        background: #22d3ee;
        color: #0b1020;
      }
      .btn.sec {
        border-color: #475569;
        color: #94a3b8;
      }
      .btn.sec:hover {
        background: #475569;
        color: #e2e8f0;
      }
      .hint {
        margin-top: 26px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.74rem;
        color: #475569;
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: reduce) {
        .sprite {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div
        class="sprite"
        role="img"
        aria-label="Pixel art ghost"
        style="
          box-shadow:
            24px 0 #22d3ee,
            32px 0 #22d3ee,
            40px 0 #22d3ee,
            16px 8px #22d3ee,
            24px 8px #22d3ee,
            32px 8px #22d3ee,
            40px 8px #22d3ee,
            48px 8px #22d3ee,
            8px 16px #22d3ee,
            16px 16px #22d3ee,
            24px 16px #fff,
            32px 16px #22d3ee,
            40px 16px #fff,
            48px 16px #22d3ee,
            56px 16px #22d3ee,
            8px 24px #22d3ee,
            16px 24px #22d3ee,
            24px 24px #0b1020,
            32px 24px #22d3ee,
            40px 24px #0b1020,
            48px 24px #22d3ee,
            56px 24px #22d3ee,
            8px 32px #22d3ee,
            16px 32px #22d3ee,
            24px 32px #22d3ee,
            32px 32px #22d3ee,
            40px 32px #22d3ee,
            48px 32px #22d3ee,
            56px 32px #22d3ee,
            8px 40px #22d3ee,
            16px 40px #22d3ee,
            24px 40px #22d3ee,
            32px 40px #22d3ee,
            40px 40px #22d3ee,
            48px 40px #22d3ee,
            56px 40px #22d3ee,
            8px 48px #22d3ee,
            24px 48px #22d3ee,
            40px 48px #22d3ee,
            56px 48px #22d3ee;
        "
      ></div>
      <p class="code uppercase">Error 404</p>
      <h1 class="uppercase">Page not found</h1>
      <p class="lede">
        You wandered off the map. The page you're after doesn't exist — or it
        did, three versions ago.
      </p>
      <div class="acts">
        <a class="btn" href="https://ctf.pages.dev/">Continue</a
        ><a class="btn sec" href="https://nilfalse.com/">Main menu</a>
      </div>
      <p class="hint">The sprite above is one div and 40 box-shadows.</p>
    </div>
  </body>
</html>
